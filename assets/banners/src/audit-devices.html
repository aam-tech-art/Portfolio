<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Free website audit post: device mock-up</title>
  <link rel="stylesheet" href="banner.css" />
  <style>
    .post {
      background:
        radial-gradient(ellipse at 50% 100%, rgba(35, 83, 71, 0.30), transparent 60%),
        linear-gradient(180deg, var(--pine-50), var(--cream));
      text-align: center;
      padding: 70px 70px 0;
    }
    .brand { justify-content: center; margin-bottom: 40px; }
    .eyebrow { color: var(--pine-600); margin-bottom: 22px; }
    h1 { font-size: 72px; font-weight: 600; line-height: 1.06; }
    .sub { margin-top: 20px; font-size: 26px; line-height: 1.45; color: var(--muted); }

    /* Same laptop and phone frames as the launch post, a little lower to make room for the text */
    .laptop { position: absolute; left: 50%; bottom: 64px; transform: translateX(-50%); width: 760px; }
    .lid { background: var(--pine-900); border-radius: 26px 26px 0 0; padding: 18px 18px 20px; box-shadow: 0 40px 70px -30px rgba(5, 31, 32, 0.6); }
    .screen { position: relative; width: 724px; height: 452px; overflow: hidden; border-radius: 8px; background: var(--cream); }
    .base { height: 22px; margin: 0 -42px; background: linear-gradient(var(--pine-700), var(--pine-900)); border-radius: 0 0 22px 22px; }
    .base::before { content: ''; display: block; width: 140px; height: 8px; margin: 0 auto; background: rgba(218, 241, 222, 0.18); border-radius: 0 0 8px 8px; }

    /* On the left this time, so it doesn't cover the audit form on the laptop's right side */
    .phone { position: absolute; left: 70px; bottom: 44px; width: 220px; padding: 12px; background: var(--pine-900); border-radius: 34px; box-shadow: 0 30px 60px -20px rgba(5, 31, 32, 0.65); }
    .phone .screen { width: 196px; height: 410px; border-radius: 24px; }

    /* Each screen is shifted down the page to the audit form (measured: 957 px down on a
       1440 px laptop, 2169 px down on a 390 px phone). The frames are tall enough that the
       cookie notice, pinned to the bottom, stays out of view. */
    iframe { position: absolute; top: 0; left: 0; border: 0; transform-origin: 0 0; pointer-events: none; }
    .laptop iframe { width: 1440px; height: 1800px; transform: scale(0.5028) translateY(-560px); }
    .phone iframe { width: 390px; height: 3300px; transform: scale(0.5026) translateY(-2049px); }

    .badge {
      position: absolute; right: 60px; bottom: 70px;
      padding: 18px 26px; border-radius: 18px; text-align: left;
      background: var(--pine-700); color: var(--pine-100);
      box-shadow: 0 18px 36px -18px rgba(5, 31, 32, 0.6);
    }
    .badge strong { display: block; font-family: 'DM Sans', sans-serif; font-size: 44px; line-height: 1; color: var(--pine-50); }
    .badge span { font-size: 20px; font-weight: 600; }
  </style>
</head>
<body>
  <div class="post">
    <div class="brand"><img src="../../../public/logo-mark-light.png" alt="" /><span>Technology</span></div>
    <p class="eyebrow">Free, no obligation</p>
    <h1 class="display">Get a <span class="gradient">free website audit</span></h1>
    <p class="sub">Send us your website and we'll email you<br />3 quick wins for speed, design and SEO.</p>

    <!-- The screens open the live site's free audit form. Change the src addresses to show
         another page or website, then export again. -->
    <div class="laptop">
      <div class="lid"><div class="screen"><iframe src="https://muhammad-mubashir-awan.github.io/AAM-tech-Portfolio/contact" title="Audit form on a laptop" scrolling="no"></iframe></div></div>
      <div class="base"></div>
    </div>

    <div class="phone"><div class="screen"><iframe src="https://muhammad-mubashir-awan.github.io/AAM-tech-Portfolio/contact" title="Audit form on a phone" scrolling="no"></iframe></div></div>

    <div class="badge"><strong>48h</strong><span>Results in your inbox</span></div>
  </div>
</body>
</html>
