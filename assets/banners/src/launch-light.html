<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Launch post: light and clean</title>
  <link rel="stylesheet" href="banner.css" />
  <style>
    .post {
      background:
        radial-gradient(circle at 88% 12%, rgba(35, 83, 71, 0.14), transparent 42%),
        radial-gradient(circle at 8% 96%, rgba(142, 182, 155, 0.28), transparent 40%),
        var(--cream);
      padding: 84px;
      display: flex;
      flex-direction: column;
    }
    /* Faint dot grid, a nod to the website's dot animation */
    .post::before {
      content: '';
      position: absolute;
      inset: 0;
      background-image: radial-gradient(rgba(35, 83, 71, 0.16) 1.6px, transparent 1.6px);
      background-size: 30px 30px;
      mask-image: linear-gradient(135deg, transparent 35%, #000 100%);
    }
    .top { position: relative; display: flex; align-items: center; justify-content: space-between; }
    .live {
      display: inline-flex; align-items: center; gap: 12px;
      padding: 12px 22px; border-radius: 999px;
      background: var(--pine-50); border: 1.5px solid var(--border);
      font-size: 20px; font-weight: 700; letter-spacing: 0.08em; color: var(--pine-600);
    }
    .live i { width: 12px; height: 12px; border-radius: 50%; background: #22a560; box-shadow: 0 0 0 6px rgba(34, 165, 96, 0.18); }
    .body { position: relative; margin-top: auto; }
    .eyebrow { color: var(--pine-600); margin-bottom: 30px; }
    h1 { font-size: 104px; font-weight: 600; line-height: 1.02; margin-bottom: 34px; }
    p { font-size: 32px; line-height: 1.45; color: var(--muted); max-width: 820px; }
    .chips { display: flex; flex-wrap: wrap; gap: 14px; margin-top: 44px; }
    .chips span {
      padding: 14px 24px; border-radius: 999px;
      background: var(--pine-50); border: 1.5px solid var(--border);
      font-size: 24px; font-weight: 600; color: var(--pine-700);
    }
    .bottom { position: relative; margin-top: 64px; display: flex; align-items: center; justify-content: space-between; }
    .cta { background: var(--pine-700); color: var(--pine-100); box-shadow: 0 16px 34px -16px rgba(5, 31, 32, 0.6); }
    .note { font-size: 22px; color: var(--muted); text-align: right; line-height: 1.4; }
  </style>
</head>
<body>
  <div class="post">
    <div class="top">
      <div class="brand"><img src="../../../public/logo-mark-light.png" alt="" /><span>Technology</span></div>
      <div class="live"><i></i>NOW LIVE</div>
    </div>

    <div class="body">
      <p class="eyebrow">Our new website</p>
      <h1 class="display">Websites that<br /><span class="gradient">grow your business.</span></h1>
      <p>Modern, fast and responsive websites for businesses, startups and organizations.</p>
      <div class="chips">
        <span>Services</span><span>Our work</span><span>Pricing</span><span>Free website audit</span>
      </div>
    </div>

    <div class="bottom">
      <span class="cta">Explore the website <span aria-hidden="true">→</span></span>
      <p class="note">Web design &amp;<br />development studio</p>
    </div>
  </div>
</body>
</html>
